name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and extract zip
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          if [ -n "$ZIP" ]; then
            echo "Extracting $ZIP"
            unzip -o "$ZIP"
          fi

      - name: Find gradlew
        id: find
        run: |
          GRADLEW=$(find . -maxdepth 4 -name "gradlew" -not -path "./.gradle/*" | head -1)
          DIR=$(dirname "$GRADLEW")
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "Found gradlew at: $DIR"

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: temurin
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x "${{ steps.find.outputs.dir }}/gradlew"

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: OverflowAnimations
          path: ${{ steps.find.outputs.dir }}/versions/**/build/libs/*.jar
          
