name: Build from ZIP

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

jobs:
  build:
    name: Extract & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find zip file
        id: findzip
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          echo "zip=$ZIP" >> $GITHUB_OUTPUT
          echo "Found zip: $ZIP"

      - name: Extract zip
        if: steps.findzip.outputs.zip != ''
        run: |
          unzip -o "${{ steps.findzip.outputs.zip }}"
          ls -la

      - name: Find project root
        id: findroot
        run: |
          ROOT=$(find . -maxdepth 3 -name "build.gradle.kts" -not -path "./.gradle/*" -not -path "./.github/*" | head -1 | xargs dirname)
          echo "root=$ROOT" >> $GITHUB_OUTPUT
          echo "Project root: $ROOT"

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: temurin
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew permissions
        run: |
          chmod +x ${{ steps.findroot.outputs.root }}/gradlew || true

      - name: Build
        working-directory: ${{ steps.findroot.outputs.root }}
        run: ./gradlew build --no-daemon

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OverflowAnimations-Jar
          path: ${{ steps.findroot.outputs.root }}/versions/**/build/libs/*.jar
          
